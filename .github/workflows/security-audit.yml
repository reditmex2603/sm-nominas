name: security-audit

on:
  schedule:
    # Revisión diaria de dependencias (seguridad) a las 06:00 UTC
    - cron: "0 6 * * *"
  push:
    branches:
      - develop
      - main
      - master
  pull_request:
    branches:
      - develop
      - main
      - master

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '22'

      - name: Composer Audit (vulnerabilidades PHP)
        run: composer audit --locked --no-interaction

      - name: NPM Audit (vulnerabilidades frontend)
        run: npm audit --audit-level=high