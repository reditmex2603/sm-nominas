# Nginx para Laravel + Inertia detrás de Cloudflare Tunnel.
# El tráfico llega desde cloudflared (localhost) como HTTP; el esquema real
# (HTTPS) se reenvía a PHP-FPM vía X-Forwarded-Proto / HTTPS on.

server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    # Límite de subida acorde a upload_max_filesize (documentos/evidencias)
    client_max_body_size 50M;

    # Assets estáticos del build de Vite: cache larga (inmutables por hash)
    location /build/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # Archivos públicos (logos, marca) vía enlace storage -> storage/app/public
    location /storage/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # Rutas públicas especiales (robots, favicon)
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # SPA / Inertia: todo lo demás se resuelve a index.php
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Denegar acceso a archivos ocultos (salvo .well-known, usado por passkeys)
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Proxy a PHP-FPM
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;

        # Host real (requerido por Symfony/Laravel para generar URLs)
        fastcgi_param HTTP_HOST $http_host;

        # Esquema seguro (TLS termina en Cloudflare). Fuerza HTTPS en Laravel.
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;

        # Buffers amplios: las respuestas de Inertia/Vite incluyen cabeceras
        # grandes (Link de preload + Set-Cookie de sesión cifrada).
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;

        fastcgi_read_timeout 120;
    }
}
