# Despliegue de producción con Cloudflare Tunnel (cloudflared).
#
# Ejecución:
#   cp .env.example.production .env
#   # editar .env con los valores reales
#   docker compose up -d --build
#
# Docker Compose lee .env automáticamente para interpolar ${...} (no hace falta
# --env-file). El puerto WEB_PORT enlaza en 0.0.0.0, origen del túnel de Cloudflare.
# TLS lo termina Cloudflare en el borde; el origen es HTTP local.

x-app: &app
  build:
    context: .
    dockerfile: docker/Dockerfile
    target: php
  image: nominas-sm/app
  restart: unless-stopped
  volumes:
    - app-storage:/var/www/html/storage
    - ./.env:/var/www/html/.env:ro
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
    ssr:
      condition: service_healthy
  networks:
    - backend

services:
  app:
    <<: *app
    healthcheck:
      test:
        [
          "CMD",
          "php",
          "-r",
          "exit(fsockopen('127.0.0.1', 9000) ? 0 : 1);",
        ]
      interval: 10s
      timeout: 5s
      retries: 12

  queue:
    <<: *app
    entrypoint: ["php", "artisan", "queue:work"]
    command:
      - redis
      - --sleep=3
      - --tries=3
      - --timeout=90
      - --max-time=3600
      - --max-jobs=1000

  scheduler:
    <<: *app
    entrypoint: ["sh", "/usr/local/bin/scheduler.sh"]

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: web
    image: nominas-sm/web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - app-storage:/var/www/html/storage:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - backend

  ssr:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: ssr
    image: nominas-sm/ssr
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:13714/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?debe definirse en .env}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "127.0.0.1",
          "-p${MYSQL_ROOT_PASSWORD}",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - backend

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "-a",
          "${REDIS_PASSWORD}",
          "ping",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  db-data:
  redis-data:
  app-storage:
